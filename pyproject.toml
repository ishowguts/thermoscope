[project]
name = "thermoscope"
version = "0.1.0"
description = "Evidence-based industrial thermal analysis"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "rasterio==1.5.1",
  "numpy==2.5.3",
]

[dependency-groups]
dev = ["httpx2==2.13.1", "pytest==9.1.1", "ruff==0.16.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["integration: requires a disposable PostgreSQL/PostGIS database"]
# rasterio 1.5.1 still multiplies Affine objects internally; our code does not.
filterwarnings = ["ignore:Use `@` matmul:PendingDeprecationWarning:rasterio"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
