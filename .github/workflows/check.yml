name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: thermoscope
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: thermoscope_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U thermoscope -d thermoscope_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://thermoscope:disposable-ci-only@127.0.0.1:55432/thermoscope_dev
      APP_DATA_MODE: SYNTHETIC_FIXTURE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: python -m pip install uv==0.12.19
      - run: make install
      - run: make check
      - run: make integration
